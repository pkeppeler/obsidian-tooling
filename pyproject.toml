[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian_tooling"
version = "0.1.0"
description = "Claude Code-driven GTD tooling for Obsidian vaults (inbox triage, monthly task archival, slash commands)"
requires-python = "==3.14.*"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = ["pyright", "pytest", "pytest-cov", "ruff"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
exclude = ["local/vault", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["local/vault"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["obsidian_tooling"]

[tool.pytest.ini_options]
addopts = "--cov=obsidian_tooling --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/obsidian_tooling"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
