name: zizmor

# GitHub Actions security audit. Catches unpinned actions (tags/branches
# instead of 40-char SHAs), excessive permissions, credential-persistence
# risks, untrusted-input usage, and more. See https://docs.zizmor.sh.
#
# Latest zizmor is installed each run so new audits land automatically —
# pinning the version would defeat the purpose of a security linter.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv tool install zizmor
      - run: zizmor .
